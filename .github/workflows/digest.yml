name: Tech digest

on:
  schedule:
    - cron: "0 7 * * 1,3,5"
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode: digest or breaking"
        required: false
        default: "digest"

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Determine run mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
          elif [ "$(date +%H)" = "07" ]; then
            echo "mode=digest" >> $GITHUB_OUTPUT
          else
            echo "mode=breaking" >> $GITHUB_OUTPUT
          fi
      - name: Run digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DIGEST_RECIPIENT: ${{ secrets.DIGEST_RECIPIENT }}
          HN_BREAKING_THRESHOLD: "300"
        run: python digest.py ${{ steps.mode.outputs.mode }}
